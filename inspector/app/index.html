<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leather Inspector</title>
<style>
  :root { --bg:#f6f4f1; --card:#fff; --ink:#1d1b19; --muted:#6b655e; --line:#e3ded7;
          --pass:#1f7a4d; --fail:#b3261e; --review:#a86400; --accent:#7a4a24; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151311; --card:#1f1c19; --ink:#efeae4; --muted:#a39b91; --line:#35302b;
          --pass:#4cc38a; --fail:#ff7b72; --review:#e6a23c; --accent:#d29b6c; } }
  * { box-sizing:border-box }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--ink) }
  header { padding:20px 24px 8px; display:flex; gap:12px; align-items:baseline; flex-wrap:wrap }
  h1 { font-size:20px; margin:0 } .muted { color:var(--muted); font-size:13px }
  main { display:grid; grid-template-columns:minmax(260px,340px) 1fr; gap:16px; padding:8px 24px 32px }
  @media (max-width:820px) { main { grid-template-columns:1fr; padding:8px 16px 24px } header { padding:16px } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; max-height:420px; overflow:auto }
  .grid img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:6px; cursor:pointer; border:2px solid transparent }
  .grid img.sel { border-color:var(--accent) }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer }
  button.ghost { background:transparent; color:var(--accent) } button:disabled { opacity:.5; cursor:wait }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px }
  .badge { display:inline-block; padding:4px 12px; border-radius:999px; font-weight:700; letter-spacing:.04em; color:#fff; text-transform:uppercase }
  .pass { background:var(--pass) } .fail { background:var(--fail) } .review { background:var(--review) }
  .step { border-top:1px solid var(--line); padding:10px 0 } .step:first-child { border-top:0 }
  .step code { font-size:12.5px; word-break:break-all } .step pre { white-space:pre-wrap; font-size:12px; color:var(--muted); margin:6px 0 0; max-height:120px; overflow:auto }
  .step img { max-width:min(100%,380px); border-radius:6px; margin-top:6px; display:block }
  ul { margin:6px 0 0 18px; padding:0 } .kv { display:grid; grid-template-columns:auto 1fr; gap:2px 12px; font-size:13px; margin-top:8px }
  .warn { color:var(--review); font-size:13px }
</style>
</head>
<body>
<header><h1>Leather Inspector</h1><span class="muted" id="meta">loading…</span></header>
<main>
  <section class="card">
    <strong>Pick a photo</strong>
    <div class="grid" id="samples"></div>
    <div class="row"><input type="file" id="file" accept=".png,.jpg,.jpeg"></div>
    <div class="row"><button id="go" disabled>Inspect</button><span class="muted" id="busy"></span></div>
  </section>
  <section class="card" id="out"><span class="muted">The verdict, the policy decision and every step the agent took appear here.</span></section>
</main>
<script>
const $ = s => document.querySelector(s);
let picked = null, policy = null;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

fetch("/api/samples").then(r => r.json()).then(d => {
  policy = d.policy;
  $("#meta").textContent = `model ${d.model} · ` + (policy ? `escalation: ${policy.signal} > ${(+policy.threshold).toPrecision(3)} (chosen on dev)` : "no dev policy yet: showing raw agent decisions");
  for (const s of d.samples) {
    const img = document.createElement("img");
    img.src = "/api/photo/" + s; img.alt = "sample photo"; img.loading = "lazy";
    img.onclick = () => { document.querySelectorAll(".grid img").forEach(i => i.classList.remove("sel")); img.classList.add("sel"); picked = s; $("#file").value = ""; $("#go").disabled = false; };
    $("#samples").appendChild(img);
  }
});
$("#file").onchange = () => { picked = null; document.querySelectorAll(".grid img").forEach(i => i.classList.remove("sel")); $("#go").disabled = !$("#file").files.length; };

$("#go").onclick = async () => {
  $("#go").disabled = true; $("#busy").textContent = "inspecting… (about 20-30 s)";
  try {
    let r;
    if ($("#file").files.length) { const f = new FormData(); f.append("file", $("#file").files[0]); r = await fetch("/api/inspect/upload", {method:"POST", body:f}); }
    else r = await fetch("/api/inspect/sample", {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({path:picked})});
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    render(await r.json());
  } catch (e) { $("#out").innerHTML = `<span class="warn">Failed: ${esc(e.message)}</span>`; }
  $("#go").disabled = false; $("#busy").textContent = "";
};

function render(d) {
  const v = d.verdict || {};
  const sig = Object.entries(d.signals).map(([k, x]) => `<span>${esc(k)}</span><span>${(+x).toFixed(2)}</span>`).join("");
  let html = `<div class="row"><span class="badge ${esc(d.final)}">${esc(d.final)}</span>
    <span>${d.final === "review" ? "sent to a human: the agent said <b>" + esc(v.decision) + "</b>" : ""}</span></div>
    <div class="kv"><span>defect</span><span><b>${esc(v.defect_type)}</b></span><span>confidence</span><span>${esc(v.confidence)}</span>
    <span>detector</span><span>${d.detector.score} (normal ≤ ${d.detector.threshold})</span><span>run</span><span>${esc(d.status)}, ${d.tool_calls} tool calls, ${d.seconds}s</span>${sig}</div>
    <ul>${(v.reasons || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
  if (d.final !== "review") html += `<div class="row"><button class="ghost" onclick="this.outerHTML='<span class=&quot;warn&quot;>Marked for human review.</span>'">Escalate to human</button></div>`;
  html += `<h3 style="font-size:15px;margin:18px 0 4px">What the agent did</h3>`;
  for (const s of d.steps) {
    if (!s.tool) { html += `<div class="step muted">${esc(s.text)}</div>`; continue; }
    html += `<div class="step"><code>${esc(s.tool)}(${esc(s.args)})</code><pre>${esc(s.result)}</pre>${s.images.map(u => `<img src="${u}" alt="${esc(s.tool)} image">`).join("")}</div>`;
  }
  $("#out").innerHTML = html;
}
</script>
</body>
</html>
